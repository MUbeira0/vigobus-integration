name: 💡 Feature Request
description: Suggest an idea or improvement for the project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for helping improve the project!

        Before submitting a feature request, please search the existing issues to make sure a similar request has not already been submitted.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem would this feature solve?
      placeholder: Describe the problem or use case...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature or improvement you would like to see.
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or workarounds have you considered?
      placeholder: Describe any alternatives or workarounds...

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Provide examples of how this feature could be used.
      placeholder: Provide examples if applicable...

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other information that may help us understand your request.
      placeholder: Anything else we should know?

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and this feature has not already been requested.
          required: true
        - label: This feature is related to the scope of the project.
          required: true