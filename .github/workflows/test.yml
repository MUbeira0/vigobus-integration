name: Lint & tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff pytest
      - name: Lint
        run: ruff check custom_components/ tests/
      - name: Test
        run: pytest tests/ -q
