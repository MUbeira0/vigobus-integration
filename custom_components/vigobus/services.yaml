refresh:
  name: Refresh
  description: Force VigoBus refresh
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id. If omitted, refreshes all VigoBus entries.
      example: "8db44e9f9f4ef0f4f7b5e0a4baf00001"

nearest_stops:
  name: Nearest stops
  description: >
    Stateless lookup: returns the closest stop(s) to the given coordinates,
    each with its upcoming buses and any active line alerts. Intended for
    dashboard cards that read the viewing device's own live geolocation and
    pass it in on every call, so the result reflects whoever is looking at
    the dashboard right now instead of a fixed home or tracker location.
    Returns several candidates when more than one stop is within
    tie_margin_m of the closest one.
  fields:
    latitude:
      name: Latitude
      description: Latitude of the viewing device.
      required: true
      example: 42.2328
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitude:
      name: Longitude
      description: Longitude of the viewing device.
      required: true
      example: -8.7226
      selector:
        number:
          min: -180
          max: 180
          step: any
    tie_margin_m:
      name: Tie margin (meters)
      description: Also return stops within this many meters of the closest one.
      example: 60
      selector:
        number:
          min: 0
          max: 500
    max_candidates:
      name: Max candidates
      description: Maximum number of candidate stops to return.
      example: 3
      selector:
        number:
          min: 1
          max: 5
    line:
      name: Line
      description: Only return buses for this line (e.g. "C1"). Leave empty for all lines.
      example: "C1"
    lang:
      name: Language
      description: Language for each stop's line alerts ("es", "gl" or "en"). Defaults to "es".
      example: "es"

search_stops:
  name: Search stops
  description: >
    Stateless lookup: returns stops matching a name or id substring, ranked
    best match first. Intended for a dashboard card's destination search when
    planning a trip (see plan_trip) — a stop found here can be passed
    straight into plan_trip's origin_stop_id/destination_stop_id.
  fields:
    query:
      name: Query
      description: Stop name or id to search for (e.g. "urzaiz" or "3493").
      required: true
      example: "urzaiz"
    limit:
      name: Limit
      description: Maximum number of matching stops to return.
      example: 8
      selector:
        number:
          min: 1
          max: 25

geocode:
  name: Geocode a place
  description: >
    Stateless lookup: turns a free-text address or named place (a school, a
    shopping mall, a hospital) into coordinates, via OpenStreetMap's public
    Nominatim service. Results are restricted to the Vigo area. Intended for
    a dashboard card's destination search when planning a trip (see
    plan_trip) — a result found here can be passed straight into
    plan_trip's destination_latitude/destination_longitude. Results must be
    attributed to OpenStreetMap contributors wherever they're shown, per
    Nominatim's usage policy.
  fields:
    query:
      name: Query
      description: An address or place name to search for (e.g. "Centro Comercial A Laxe" or "Hospital Alvaro Cunqueiro").
      required: true
      example: "Centro Comercial A Laxe"
    limit:
      name: Limit
      description: Maximum number of matching places to return.
      example: 5
      selector:
        number:
          min: 1
          max: 10
    lang:
      name: Language
      description: Language for the returned place names/addresses ("es", "gl" or "en"). Defaults to "es".
      example: "es"

plan_trip:
  name: Plan a trip
  description: >
    Stateless lookup: plans a bus trip (with transfers) from an origin to a
    destination using Vigo's official static GTFS schedule for Vitrasa, and
    returns one or more itineraries (each a list of walk/bus legs with clock
    times — a bus leg's "shape" field is its real as-driven street geometry
    from the feed, trimmed to that ride, for drawing it on a map), sorted by
    arrival time — additional options only appear when
    using more transfers actually arrives sooner. Each end can be given
    either as coordinates (the closest stops within max_walk_m are
    considered — use geocode to turn a free-text address or place name into
    coordinates first) or as an exact stop_id from search_stops/nearest_stops.
    Known limitations: only the itinerary's first bus leg is cross-checked
    against live arrival data, everything after that is timetable-only; a
    query very late at night (after midnight) may miss a trip that started
    the previous service day.
  fields:
    origin_latitude:
      name: Origin latitude
      description: Origin latitude. Omit if origin_stop_id is given instead.
      example: 42.2328
      selector:
        number:
          min: -90
          max: 90
          step: any
    origin_longitude:
      name: Origin longitude
      description: Origin longitude. Omit if origin_stop_id is given instead.
      example: -8.7226
      selector:
        number:
          min: -180
          max: 180
          step: any
    origin_stop_id:
      name: Origin stop id
      description: An exact GTFS stop id to start from (from search_stops' "stop_id"). Omit if using coordinates instead.
      example: "3493"
    destination_latitude:
      name: Destination latitude
      description: Destination latitude. Omit if destination_stop_id is given instead.
      example: 42.2137
      selector:
        number:
          min: -90
          max: 90
          step: any
    destination_longitude:
      name: Destination longitude
      description: Destination longitude. Omit if destination_stop_id is given instead.
      example: -8.7744
      selector:
        number:
          min: -180
          max: 180
          step: any
    destination_stop_id:
      name: Destination stop id
      description: An exact GTFS stop id to arrive at (from search_stops' "stop_id"). Omit if using coordinates instead.
      example: "5557"
    depart_at:
      name: Depart at
      description: Departure time as "HH:MM", same day. Leave empty to depart now.
      example: "18:00"
    max_transfers:
      name: Max transfers
      description: Maximum number of line changes to consider.
      example: 2
      selector:
        number:
          min: 0
          max: 2
    max_walk_m:
      name: Max walk (meters)
      description: How far to walk to/from a stop at each end when given coordinates.
      example: 800
      selector:
        number:
          min: 100
          max: 2000
    max_itineraries:
      name: Max itineraries
      description: Maximum number of route options to return, only when using more transfers actually arrives sooner (otherwise fewer are returned).
      example: 3
      selector:
        number:
          min: 1
          max: 5
    include_live:
      name: Include live data
      description: Cross-check the first bus leg against live arrival data when its departure is soon. Defaults to true.
      example: true
    ors_api_key:
      name: OpenRouteService API key
      description: >
        Optional. When set, the first and last walk legs get a real
        street-level walking route (via OpenRouteService) instead of a
        straight line between their two points. Get a free key at
        openrouteservice.org/dev (2000 requests/day) — no free, keyless
        walking-routing service exists that's safe for a distributed app
        the way OpenFreeMap solves that for map tiles, so this is opt-in.
      example: "5b3ce3597851110001cf6248xxxxxxxxxxxxxxxxxxxxxxxx"
